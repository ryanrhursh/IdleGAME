<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120c22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marigold">
<title>The Marigold Line</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap');
:root {
  --bg: #120c22; --glass: rgba(26, 18, 42, .8); --glass2: rgba(40, 28, 62, .92); --line: rgba(255, 214, 160, .16);
  --fg: #f8eedd; --muted: #bcaccb; --gold: #f2b134; --gold-ink: #2c1a04; --teal: #6fe0d0; --rose: #ff8aa6; --bad: #ff7a7a; --good: #7dffb0;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --ui: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 500 15px/1.4 var(--ui); overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.float { position: absolute; transform: translate(-50%, -50%); font-weight: 700; color: #ffe2a8; text-shadow: 0 1px 6px rgba(0,0,0,.85); animation: rise 1.4s ease-out forwards; white-space: nowrap; font-variant-numeric: tabular-nums; }
.float.perfect { color: #9dffc4; font-size: 18px; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -220%); } }
.rname { position: absolute; transform: translate(-50%, -50%); font: 700 10.5px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: rgba(255,240,220,.85); text-shadow: 0 1px 4px #000; white-space: nowrap; }
.ptag { position: absolute; transform: translate(-50%, -100%); font: 700 11px var(--ui); color: #fff1d8; background: rgba(30, 20, 50, .7); border: 1px solid var(--line); padding: 1px 7px; border-radius: 99px; white-space: nowrap; text-shadow: 0 1px 2px #000; }
.bubble { position: absolute; transform: translate(-50%, -100%); background: var(--glass2); border: 1px solid var(--line); padding: 5px 10px; border-radius: 12px; font-size: 12.5px; max-width: 190px; text-align: center; backdrop-filter: blur(6px); }
.bubble b { color: var(--gold); margin-right: 4px; }

#hud { position: fixed; left: calc(var(--sal) + 10px); right: calc(var(--sar) + 10px); top: calc(var(--sat) + 10px); display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
.pill { pointer-events: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 7px 12px; backdrop-filter: blur(10px); display: grid; gap: 1px; min-width: 0; }
.pill .row { display: flex; align-items: center; gap: 7px; }
.pill b { font: 700 19px/1 var(--display); font-variant-numeric: tabular-nums; }
.pill small { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.charm { background: radial-gradient(circle at 35% 30%, #fff, #ffd36a 55%, #e0902a); box-shadow: 0 0 10px #ffd36a; border-radius: 3px; transform: rotate(45deg); }
.dot.mile { background: #6fe0d0; box-shadow: 0 0 8px #6fe0d0; }
#milePill { margin-left: auto; text-align: right; }
#milePill .row { justify-content: flex-end; }
#milePill b { font-size: 16px; }
#menuBtn { pointer-events: auto; width: 40px; height: 40px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); font-size: 18px; flex: none; }

#hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 172px); max-width: min(520px, calc(100vw - 28px)); background: var(--glass2); border: 1px solid var(--gold); padding: 9px 16px; border-radius: 16px; text-align: center; font-size: 14px; backdrop-filter: blur(10px); pointer-events: none; }
#fork { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--sat) + 76px); width: min(520px, calc(100vw - 20px)); display: grid; gap: 6px; text-align: center; }
#fork .cap { font: 700 11px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); text-shadow: 0 1px 4px #000; }
#fork .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fk { background: var(--glass2); border: 1.5px solid var(--line); border-radius: 16px; padding: 9px 10px; display: grid; gap: 2px; backdrop-filter: blur(10px); }
.fk b { font: 700 15px var(--display); } .fk small { color: var(--muted); font-size: 11.5px; }
.fk[aria-pressed="true"] { border-color: var(--good); background: rgba(40, 80, 60, .85); }
#platform { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--sat) + 76px); background: var(--gold); color: var(--gold-ink); padding: 9px 16px; border-radius: 99px; font-weight: 700; box-shadow: 0 0 22px rgba(242, 177, 52, .6); animation: pulse 1.6s ease-in-out infinite; max-width: calc(100vw - 20px); }
@keyframes pulse { 50% { box-shadow: 0 0 34px rgba(242, 177, 52, .95); } }

#stoke { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 78px); display: grid; gap: 6px; justify-items: center; width: min(300px, calc(100vw - 24px)); }
#stokeBtn { width: 100%; height: 58px; border-radius: 20px; background: var(--glass2); border: 1.5px solid var(--gold); position: relative; overflow: hidden; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
#stokeBtn .zone { position: absolute; top: 0; bottom: 0; left: 38%; width: 24%; background: rgba(125, 255, 176, .28); border-left: 2px solid rgba(125,255,176,.7); border-right: 2px solid rgba(125,255,176,.7); }
#stokeBtn .needle { position: absolute; top: 0; bottom: 0; width: 5px; background: #fff; box-shadow: 0 0 12px #fff; border-radius: 3px; left: 0; }
#stokeBtn span { position: relative; text-shadow: 0 1px 4px #000; }
#steam { width: 100%; height: 6px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; }
#steam i { display: block; height: 100%; background: linear-gradient(90deg, #6fe0d0, #f2b134, #ff7a5a); width: 20%; }
#steamTxt { font-size: 11px; color: var(--muted); text-shadow: 0 1px 3px #000; }

#inbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 78px); display: flex; gap: 8px; }
.tool { background: var(--glass2); border: 1.5px solid var(--line); border-radius: 18px; padding: 11px 18px; font-weight: 700; backdrop-filter: blur(10px); }
.tool.primary { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.tool[aria-pressed="true"] { border-color: var(--good); }

#dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 10px); display: flex; gap: 4px; background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 5px; backdrop-filter: blur(12px); max-width: calc(100vw - 16px); }
#dock button { min-width: 64px; height: 52px; padding: 0 10px; border-radius: 17px; font-weight: 700; font-size: 13.5px; display: grid; gap: 1px; place-items: center; align-content: center; color: var(--muted); position: relative; }
#dock button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#dock button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
.badge { position: absolute; top: 5px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 8px var(--rose); }

#sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 76px); width: min(520px, calc(100vw - 16px)); background: var(--glass2); border: 1px solid var(--line); border-radius: 22px; padding: 14px; backdrop-filter: blur(14px); display: grid; gap: 10px; max-height: 56vh; overflow: auto; touch-action: pan-y; }
#sheet h3 { margin: 0; font: 700 17px/1.2 var(--display); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
#sheet h3 small { font: 500 12px var(--ui); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.act { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 15px; padding: 10px; text-align: left; display: grid; gap: 3px; min-height: 60px; align-content: start; }
.act:hover { border-color: var(--gold); }
.act b { font-size: 14px; }
.act .cost { font-size: 12px; color: var(--gold); font-variant-numeric: tabular-nums; }
.act .cost.no { color: var(--bad); }
.act small { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.act.primary { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.act.primary small, .act.primary .cost { color: var(--gold-ink); opacity: .85; }
.act[disabled] { opacity: .45; cursor: default; }
.act.locked { opacity: .5; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--gold); color: var(--gold-ink); border-radius: 99px; padding: 9px 18px; font-weight: 700; }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--fg); border: 1px solid var(--line); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }

#modal { position: fixed; inset: 0; background: rgba(8, 4, 16, .66); display: grid; place-items: center; padding: calc(var(--sat) + 14px) 14px calc(var(--sab) + 14px); backdrop-filter: blur(4px); z-index: 30; touch-action: pan-y; }
.card { width: min(580px, 100%); max-height: 100%; overflow: auto; background: linear-gradient(180deg, #2c2046, #1b1329); border: 1px solid var(--line); border-radius: 26px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.card h2 { margin: 0; font: 700 26px/1.1 var(--display); text-wrap: balance; }
.card h2 em { font-style: normal; color: var(--gold); }
.card p { margin: 0; color: #eadff0; line-height: 1.5; }
.card .eyebrow { font: 700 11px var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.quote { font-family: var(--display); font-style: italic; font-size: 17px; line-height: 1.5; color: #fff1d8; border-left: 3px solid var(--gold); padding-left: 14px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; } .stats div { display: grid; }
.stats b { font: 700 26px/1.1 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; } .stats small { color: var(--muted); }
.tales { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.tales li { background: rgba(255,255,255,.05); border-radius: 14px; padding: 10px 12px; font-size: 14px; line-height: 1.45; }
.tales li.locked { color: var(--muted); font-style: italic; }
.card-pc { background: #f4e8cc; color: #3a2a1a; border-radius: 6px; padding: 10px 12px; font-family: var(--display); font-size: 14px; line-height: 1.4; box-shadow: 0 2px 0 #c9b88c; }
.card-pc small { display: block; color: #8a7a5a; font: 600 10.5px var(--ui); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.pcs { display: grid; gap: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: rgba(242, 177, 52, .16); border: 1px solid rgba(242,177,52,.4); color: #ffe2a8; border-radius: 99px; padding: 3px 10px; font-size: 12px; }
.bar { height: 7px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--rose), var(--gold)); }
.list { display: grid; gap: 8px; }
.item { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 6px; text-align: left; }
.item b { font: 700 16px var(--display); } .item small { color: var(--muted); }
input[type=text] { font: inherit; background: rgba(255,255,255,.08); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; width: 100%; user-select: text; -webkit-user-select: text; }
#toast { position: fixed; left: 50%; top: calc(var(--sat) + 68px); transform: translateX(-50%); display: grid; gap: 6px; pointer-events: none; width: min(440px, calc(100vw - 24px)); z-index: 20; }
.toast { background: var(--glass2); border: 1px solid var(--line); border-radius: 14px; padding: 9px 14px; text-align: center; font-size: 13.5px; animation: toast 4.4s ease-out forwards; backdrop-filter: blur(10px); }
.toast b { color: var(--gold); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8% { opacity: 1; transform: none; } 88% { opacity: 1; } 100% { opacity: 0; } }
#fade { position: fixed; inset: 0; background: #120c22; pointer-events: none; opacity: 0; transition: opacity .22s; z-index: 15; }
#drawcost { position: fixed; transform: translate(-50%, -140%); background: var(--glass2); border: 1px solid var(--line); border-radius: 12px; padding: 5px 10px; font-size: 12.5px; pointer-events: none; z-index: 12; white-space: nowrap; }
#drawcost.bad { border-color: var(--bad); color: #ffc8c8; }

/* ---------- art-direction skins (body[data-look]) ---------- */
/* Miniature diorama: warm wood and brass, chunky friendly buttons */
body[data-look="diorama"] { --glass: rgba(62, 38, 32, .84); --glass2: rgba(78, 48, 40, .95); --line: rgba(255, 205, 140, .34); --fg: #fff4e0; --muted: #e6caa8; --gold: #ffbd45; --gold-ink: #3a1e06; --display: "Trebuchet MS", "Avenir Next Rounded", ui-rounded, system-ui, sans-serif; }
body[data-look="diorama"] .pill, body[data-look="diorama"] #dock, body[data-look="diorama"] #sheet, body[data-look="diorama"] #hint, body[data-look="diorama"] .toast, body[data-look="diorama"] .fk, body[data-look="diorama"] #menuBtn { border-width: 2px; box-shadow: 0 4px 0 rgba(24, 10, 6, .6), 0 12px 26px rgba(0, 0, 0, .35); }
body[data-look="diorama"] .card { background: linear-gradient(180deg, #5c382c, #3e2420); border: 2px solid #d29a52; border-radius: 28px; box-shadow: 0 6px 0 #1f0f0a, 0 24px 60px rgba(0,0,0,.5); }
body[data-look="diorama"] .btn, body[data-look="diorama"] .tool.primary { box-shadow: 0 4px 0 #b3761c; transform: translateY(-1px); }
body[data-look="diorama"] #dock button[aria-pressed="true"] { box-shadow: 0 3px 0 #b3761c; }
body[data-look="diorama"] .card h2, body[data-look="diorama"] .pill b { font-weight: 800; letter-spacing: -.01em; }
body[data-look="diorama"] .act, body[data-look="diorama"] .item, body[data-look="diorama"] .tales li { background: rgba(255, 220, 170, .09); border-color: rgba(255, 205, 140, .28); }

/* Painterly storybook: parchment, ink and rust */
body[data-look="storybook"] { --glass: rgba(247, 236, 212, .93); --glass2: rgba(250, 241, 220, .97); --line: rgba(90, 58, 34, .4); --fg: #3a2616; --muted: #7a5a3a; --gold: #b84a1c; --gold-ink: #fff6e4; --display: "Iowan Old Style", Palatino, Georgia, serif; --ui: "Iowan Old Style", Palatino, Georgia, serif; --bad: #b02a2a; --good: #2a7a4a; }
body[data-look="storybook"] .pill, body[data-look="storybook"] #dock, body[data-look="storybook"] #sheet, body[data-look="storybook"] #hint, body[data-look="storybook"] .toast, body[data-look="storybook"] .fk, body[data-look="storybook"] #menuBtn { border-radius: 14px 18px 12px 20px; box-shadow: 1px 2px 0 rgba(90, 58, 34, .45); }
body[data-look="storybook"] .card { background: #f7ecd4; border: 2px solid #8a5a34; border-radius: 6px 16px 8px 18px; box-shadow: 3px 5px 0 rgba(60, 36, 20, .55); color: #3a2616; }
body[data-look="storybook"] .card p, body[data-look="storybook"] .tales li { color: #4a3220; }
body[data-look="storybook"] .tales li, body[data-look="storybook"] .act, body[data-look="storybook"] .item { background: rgba(138, 90, 52, .1); border-color: rgba(90, 58, 34, .35); }
body[data-look="storybook"] .quote { color: #4a2a14; border-left-color: #b84a1c; }
body[data-look="storybook"] .card h2 { font-style: italic; font-weight: 700; }
body[data-look="storybook"] .card h2 em, body[data-look="storybook"] .stats b { color: #b84a1c; }
body[data-look="storybook"] .btn.ghost { color: #3a2616; background: rgba(138, 90, 52, .12); }
body[data-look="storybook"] .chip { background: rgba(184, 74, 28, .12); border-color: rgba(184, 74, 28, .45); color: #7a2e10; }
body[data-look="storybook"] .bar { background: rgba(90, 58, 34, .18); }
body[data-look="storybook"] #dock button { color: #7a5a3a; }
body[data-look="storybook"] .toast b, body[data-look="storybook"] .bubble b { color: #b84a1c; }
body[data-look="storybook"] #stokeBtn { background: #f7ecd4; color: #3a2616; }
body[data-look="storybook"] #stokeBtn span { text-shadow: none; }
body[data-look="storybook"] #steamTxt, body[data-look="storybook"] .rname, body[data-look="storybook"] #fork .cap { color: #fff3dc; }

/* Layered papercraft: cut paper, thick ink outline, hard offset shadows */
body[data-look="paper"] { --glass: #fff4dc; --glass2: #fff8e8; --line: #2a2030; --fg: #2a2030; --muted: #6a5a70; --gold: #ff8a2a; --gold-ink: #2a2030; --teal: #1fa6a0; --display: "Avenir Next", "Segoe UI", system-ui, sans-serif; --ui: "Avenir Next", "Segoe UI", system-ui, sans-serif; --bad: #d02a3a; --good: #1f9a5a; }
body[data-look="paper"] .pill, body[data-look="paper"] #dock, body[data-look="paper"] #sheet, body[data-look="paper"] #hint, body[data-look="paper"] .toast, body[data-look="paper"] .fk, body[data-look="paper"] #menuBtn, body[data-look="paper"] .act, body[data-look="paper"] .tool { border: 2.5px solid #2a2030; border-radius: 12px; box-shadow: 3px 4px 0 #2a2030; backdrop-filter: none; }
body[data-look="paper"] .card { background: #fff4dc; border: 3px solid #2a2030; border-radius: 14px; box-shadow: 6px 8px 0 #2a2030; color: #2a2030; }
body[data-look="paper"] .card p, body[data-look="paper"] .tales li, body[data-look="paper"] .quote { color: #2a2030; }
body[data-look="paper"] .tales li, body[data-look="paper"] .item { background: #ffe6b8; border: 2px solid #2a2030; border-radius: 10px; }
body[data-look="paper"] .quote { border-left: 5px solid #ff8a2a; }
body[data-look="paper"] .btn, body[data-look="paper"] .tool.primary, body[data-look="paper"] #dock button[aria-pressed="true"] { border: 2.5px solid #2a2030; box-shadow: 2px 3px 0 #2a2030; }
body[data-look="paper"] .btn.ghost { background: #fff; color: #2a2030; border: 2.5px solid #2a2030; }
body[data-look="paper"] .card h2 em, body[data-look="paper"] .stats b, body[data-look="paper"] .toast b, body[data-look="paper"] .bubble b { color: #e0561a; }
body[data-look="paper"] .chip { background: #ffd86a; border: 2px solid #2a2030; color: #2a2030; }
body[data-look="paper"] .bar { background: #fff; border: 2px solid #2a2030; height: 10px; }
body[data-look="paper"] #dock button { color: #6a5a70; }
body[data-look="paper"] #stokeBtn { background: #fff4dc; border: 2.5px solid #2a2030; box-shadow: 3px 4px 0 #2a2030; color: #2a2030; }
body[data-look="paper"] #stokeBtn span { text-shadow: none; }
body[data-look="paper"] #steamTxt, body[data-look="paper"] #fork .cap { color: #fff; text-shadow: 0 1px 0 #2a2030; }
body[data-look="paper"] .rname { color: #2a2030; text-shadow: none; background: #fff4dc; padding: 1px 6px; border: 2px solid #2a2030; border-radius: 6px; }

/* Moody cinematic: near-black glass, thin type, one warm light */
body[data-look="cinema"] { --glass: rgba(8, 6, 14, .6); --glass2: rgba(10, 8, 18, .82); --line: rgba(255, 190, 120, .18); --fg: #efe6da; --muted: #9a8fa8; --gold: #ffb874; --gold-ink: #1a0e04; --display: "Avenir Next", "Helvetica Neue", system-ui, sans-serif; --ui: "Avenir Next", "Helvetica Neue", system-ui, sans-serif; }
body[data-look="cinema"] .pill, body[data-look="cinema"] #dock, body[data-look="cinema"] #sheet, body[data-look="cinema"] #hint, body[data-look="cinema"] .toast, body[data-look="cinema"] .fk, body[data-look="cinema"] #menuBtn { border-radius: 6px; border-width: 1px; }
body[data-look="cinema"] .card { background: rgba(10, 8, 18, .92); border: 1px solid rgba(255, 190, 120, .25); border-radius: 8px; box-shadow: 0 30px 80px rgba(0,0,0,.8); }
body[data-look="cinema"] .card h2, body[data-look="cinema"] .pill b { font-weight: 300; letter-spacing: .02em; }
body[data-look="cinema"] .card .eyebrow, body[data-look="cinema"] #dock button, body[data-look="cinema"] .act b { letter-spacing: .12em; text-transform: uppercase; font-size: 11.5px; }
body[data-look="cinema"] .btn { border-radius: 4px; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; }
body[data-look="cinema"] .quote { font-family: var(--display); font-weight: 300; border-left: 1px solid var(--gold); }
body[data-look="cinema"] #dock button[aria-pressed="true"] { background: transparent; color: var(--gold); box-shadow: inset 0 -2px 0 var(--gold); border-radius: 0; }

<script>(()=>{var Le={sleeper:{name:"Sleeper",base:!0,cost:5,min:2,max:6,floor:8018570,floor2:7229310,blurb:"Berths for sleepers. Every three tiles holds one passenger."},dining:{name:"Dining Car",base:!0,cost:6,min:2,max:6,floor:12089674,floor2:11103040,blurb:"Long tables, warm lamps and something always on the stove."},parlor:{name:"Parlor",base:!0,cost:6,min:2,max:6,floor:10111578,floor2:9192015,blurb:"Armchairs and a rug. The best place for nothing in particular."},corridor:{name:"Corridor",base:!0,cost:2,min:2,max:14,line:!0,floor:13218954,floor2:12297852,blurb:"A one-tile passage. It links rooms and shortens the walk to dinner."},garden:{name:"Garden Room",base:!1,cost:8,min:2,max:6,floor:5212746,floor2:4685635,blurb:"Soil, light and things growing where they should not fit."},library:{name:"Library",base:!1,cost:8,min:2,max:6,floor:6965812,floor2:6242349,blurb:"Shelves to the ceiling, which here is a matter of opinion."},workshop:{name:"Workshop",base:!1,cost:8,min:2,max:6,floor:8026752,floor2:7237236,blurb:"A bench, a vice and a great many small drawers."},observatory:{name:"Observatory",base:!1,cost:9,min:3,max:6,floor:3293294,floor2:2766690,blurb:"A brass dome and a telescope pointed at whatever is out there."},bath:{name:"Bathhouse",base:!1,cost:8,min:2,max:6,floor:4889256,floor2:4361627,blurb:"A deep warm pool. Steam, and not much conversation."},music:{name:"Music Room",base:!1,cost:8,min:3,max:6,floor:12097098,floor2:11242050,blurb:"A piano that is slightly bigger on the inside, like everything else."},aquarium:{name:"Aquarium",base:!1,cost:9,min:3,max:6,floor:3041930,floor2:2580608,blurb:"Glass tanks, slow fish, and a very calm hum."}},ri={garden:"garden",library:"library",workshop:"workshop",observatory:"observatory",bath:"bath",music:"music",aquarium:"aquarium",chat:"parlor"},Mo=[{name:"Rosalind Thorne",trait:"Seedswoman with a coat full of pockets",hobby:"garden",gift:"garden",line:'A woman in a coat with far too many pockets waves a watering can. "I am bound for the Salt Orchards. I have never been invited to dinner by a train."',keep:{name:"A pocketful of seeds",line:"Everywhere on the train, something small is quietly growing."},tales:["Rosalind keeps seeds from every place she has left. She says a pocket is a very small country.",'Rosalind plants one seed at every stop and never returns. "Someone will. That is the point."',"Rosalind admits the seeds are not for growing. They are for leaving things behind that look like hope."]},{name:"Ambrose Quill",trait:"Retired postmaster who still sorts the mail",hobby:"library",gift:"library",line:'A thin man with a ledger under his arm tips his hat. "Postmaster, retired. Bound for Lantern Wick, where my last letter has been waiting forty years."',keep:{name:"A last letter, finally delivered",line:"The train feels a little more like it is going somewhere."},tales:["Ambrose sorts the dining car's napkins by destination. They do not know where they are going. He does.","Ambrose says every letter is a small door someone left open on purpose.","The forty-year-old letter is addressed to him. He has not opened it. He says that is what makes it perfect."]},{name:"Tamsin Brass",trait:"Clockmender who talks to broken things",hobby:"workshop",gift:"workshop",line:'Someone is sitting on a trunk, fixing a pocket watch with their teeth and a hairpin. "Tamsin. Clocks. Is your engine whistling? That is a cry for help."',keep:{name:"A tuned boiler gauge",line:"The engine hums a little steadier, and a little more fondly."},tales:["Tamsin says nothing is truly broken. It is only waiting for someone to ask what is wrong.","Tamsin found a clock in the Lost & Found that runs backward. She has decided it is correct.",`Tamsin opened the engine's oldest clock and found a note: "Do not hurry her. She is carrying more than you can see."`]},{name:"Old Eben",trait:"Stargazer who lost his telescope in a lake",hobby:"observatory",gift:"observatory",line:'An old man in a long scarf stares up at the dusk. "I have misplaced a telescope and a great deal of sky. Are you going anywhere with a view?"',keep:{name:"A map of the night sky",line:"The windows show more stars after dark."},tales:["Eben says the stars are not far away, only patient.","Eben has named the star he can see from every region. He never says the names aloud, only points.","Eben notes that the stars look the same from the Marigold as they did from home, and says that is how he knows the train is real."]},{name:"Cressida Vale",trait:"Opera singer on an unplanned holiday",hobby:"music",gift:"music",line:'A woman in a green velvet coat balances three hatboxes on one finger. "I have stopped singing for a season. Do you have a piano? I will not touch it."',keep:{name:"A tune left in the rafters",line:"Sometimes, very faintly, the carriages hum in harmony."},tales:["Cressida touches the piano on the third day, mostly by accident.","Cressida sings to the engine at night. It is, she says, an excellent audience, and never asks for an encore.","Cressida finishes the song she never could. Nobody applauds. Everybody understands."]},{name:"Madame Oussou",trait:"Keeper of a bathhouse that does not exist anymore",hobby:"bath",gift:"bath",line:'A small, imposing woman in a robe the color of a sunset hands you a towel. "I keep a bathhouse. Kept. Have you got a room that is warm and slightly rude to rushing?"',keep:{name:"A tin of bath salts",line:"Everyone on the train smells faintly of lavender and has stopped arguing."},tales:["Madame Oussou says a good soak solves three things and ruins one. Nobody knows what the one is.",'Madame Oussou reveals the old bathhouse was under a lake. "Hot water will find a way. It always does."',"Madame Oussou admits she is not going anywhere. She is looking for a place that deserves her."]},{name:"Fenwick Moss",trait:"Fisherman who has never caught anything on purpose",hobby:"aquarium",gift:"aquarium",line:'A man in waders carries a bucket with a very calm fish. "This is Gerald. He is not for sale, but he does love a long train ride."',keep:{name:"Gerald's tank, left behind",line:"A small, steady gurgling comes from somewhere in the walls."},tales:["Fenwick says fish do not mind water. They mind the quiet.","Fenwick has been to the bottom of most of the lakes on the Line. He says they are all the same lake.","Fenwick lets Gerald out of the bucket. Gerald swims in a tight, happy circle and does not leave."]},{name:"Juniper Oakes",trait:"A child traveling with a very serious goose",hobby:"chat",gift:"parlor",line:'A child in oversized boots stands next to a goose. "This is Admiral. She is in charge. We are going to see the sea. Do you have a sea?"',keep:{name:"Admiral's feather",line:"There is a very small flag on the roof. It was not there before."},tales:["Juniper says Admiral does not approve of the dining car. She approves of the aisle, loudly.","Juniper draws a map of the train. It has far more rooms than the real one, and she insists they are all there.","Juniper sees the sea. Admiral is unimpressed. Juniper is not."]},{name:"Hob Marlowe",trait:"A lamplighter who has run out of lamps",hobby:"workshop",gift:"workshop",line:'A man with a pole and nothing to light leans against the station wall. "Lamplighter. All my lamps got tired. Is there anywhere that needs a little more light?"',keep:{name:"A very patient lamp",line:"Somewhere on the train, a lamp lights itself when someone is sad."},tales:["Hob says a lamp does not push the dark away. It just keeps it company.","Hob lights each room before the passengers wake. He has not told anyone, and everyone knows.","Hob has run out of lamps and has begun lighting them with other people's kind words."]},{name:"Delphine Aubrey",trait:"Cartographer of places that keep moving",hobby:"library",gift:"library",line:'A woman unrolls a map that is clearly wriggling. "Cartographer. I draw places that will not hold still. May I ride along until this one stops?"',keep:{name:"A map that mostly behaves",line:"The next fork feels a little clearer than it used to."},tales:["Delphine says the Line is not on any map, so she has begun drawing it.","Delphine has found three regions that are the same place at different hours.","Delphine's map of the Line ends in a blank. She says that is not an error. It is an invitation."]},{name:"Barnaby Finch",trait:"Retired train driver who prefers to be a passenger",hobby:"chat",gift:"parlor",line:`A broad man in a driver's cap looks at the engine with a mixture of pride and envy. "Don't ask me to drive. I am here to be driven. And to criticize the whistle."`,keep:{name:"A driver's thermos, still warm",line:"The tea in the dining car never goes cold."},tales:["Barnaby says every engine has a moral character, and this one is a worrier.","Barnaby leans out the window every night. He says some roads are better listened to than looked at.","Barnaby says the Marigold has never been late in her life. She is just very, very early for something."]},{name:"The Lady Without a Name",trait:"Arrives with one small suitcase and no explanation",hobby:"observatory",gift:"observatory",line:'A woman in grey stands very still on the platform. "I would like to ride to wherever this line ends. Please do not ask my name. I am saving it."',keep:{name:"A name, spoken once",line:"The train goes quiet for a moment, then hums on."},tales:["She reads the same page of the same book at every stop and has stopped pretending it is for the story.","She asks what the track is made of. Nobody knows. She smiles as if that is an answer.","She tells you the name. You promise never to repeat it. The train, she says, already knew."]}],bl=["Ada","Bram","Cora","Dov","Elsie","Finn","Greta","Hector","Ione","Jasper","Kit","Lena","Milo","Nell","Orla","Percy","Quinn","Rue","Sunny","Tobias","Una","Vera","Wilf","Yara","Zeb"],Ml=["Applewhite","Bellwether","Cobb","Dunmore","Everly","Fairweather","Greaves","Hollis","Inkwell","Jessop","Kettle","Lark","Mossop","Nettles","Ogden","Pennywhistle","Rook","Sparrow","Thistle","Underhill","Voss","Wick"],wo=[{trait:"Collects the first light of every morning",hobby:"observatory",tales:["{n} keeps jars of dawn on the windowsill. They are empty, and {n} says that is the point.","{n} reveals each morning is stored by color, not date.","{n} opens every jar at once. The carriage fills with a very polite sunrise."]},{trait:"Teaches plants to sing",hobby:"garden",tales:["{n} says plants have been singing all along. We have only just got good at listening.","{n} hums to a tomato until it blushes.","{n} puts every plant in a circle. They are, apparently, a choir."]},{trait:"Writes the same letter in a hundred ways",hobby:"library",tales:["{n} says the letter has only one sentence and ninety-nine ways to say it.","{n} asked every passenger to read it aloud once. Everyone cried, politely.","{n} posts the letter at last. It was addressed to {n}."]},{trait:"Fixes things that are not broken yet",hobby:"workshop",tales:["{n} says maintenance is a love letter to the future.","{n} oils a hinge that has never squeaked. It does not squeak any less.","{n} announces that everything on the train is now fixed. The train hums with suspicion."]},{trait:"Hums just under the pitch of the engine",hobby:"music",tales:["{n} says the engine has a key, and it is slightly sad.","{n} has found three passengers who hum in the same key and is trying not to cry.","{n} organizes a hum. The whole train joins in. The engine, offended, blows a note."]},{trait:"Believes every fish remembers them",hobby:"aquarium",tales:["{n} nods hello to every fish. They nod back, or at least blink.","{n} says fish keep memories in the shapes of their circles.","{n} sits at the tank for an hour. The fish all face the same way, patiently."]},{trait:"Is always warm when everyone else is cold",hobby:"bath",tales:["{n} says the trick is a hot drink and a cold opinion.","{n} runs a bath for the whole carriage. Nobody needed one. Everyone is glad.","{n} admits the warmth is not a gift, only a habit of staying near people."]},{trait:"Gossips about the weather",hobby:"chat",tales:["{n} says a drizzle in the Fens is the Hills' fault. Nobody argues.","{n} predicts the weather by how the tea settles. It is wrong, but memorably so.","{n} says tomorrow will be exactly like today, but happier. It is."]}],wl=["Copper","Misty","Glass","Hollow","Saffron","Quiet","Drowned","Lantern","Moth","Salt","Cinder","Velvet","Amber","Thistle","Silver","Wandering","Hushed","Sorrel"],Sl=["Hills","Fens","Orchards","Downs","Shallows","Reaches","Meadows","Cliffs","Marsh","Wold","Barrens","Gardens","Heath","Terraces","Vale"],El=["Hollin","Marrow","Wick","Thorn","Brindle","Quay","Fen","Ash","Linden","Cobble","Sorrel","Plum","Tarn","Larch"],Tl=["Halt","Cross","Junction","Quay","End","Green","Bridge","Lane","Gate","Wharf","Mill"],ts=[{sky:[1774406,15765626],fog:6963050,ground:5201466,tint:15043162,ridge:4861782},{sky:[728890,5941440],fog:3104632,ground:3824210,tint:9425112,ridge:2313314},{sky:[2756632,15247434],fog:8014378,ground:6969904,tint:15773776,ridge:6961704},{sky:[1054254,10128080],fog:4868738,ground:4082278,tint:12101887,ridge:3553902},{sky:[928292,11065504],fog:3828310,ground:3828290,tint:10150024,ridge:2644030},{sky:[2363443,15235738],fog:7353690,ground:5914202,tint:16751296,ridge:5910358},{sky:[464159,3828362],fog:2311770,ground:3033682,tint:8044776,ridge:1850962}],Al=["clear","clear","rain","glow","snow"],Rl=["mist and reeds","copper and wind","glass lakes","lantern trees","quiet orchards","old stone","moths at dusk","salt and cliffs","velvet hills","standing water"],Cl=["a windmill whose sails turn the wrong way","a heron standing on one very patient leg","a bridge with a toll booth and no road","a field of scarecrows all facing the train","a lighthouse nowhere near water","a woman waving from a hilltop with a very large flag","a row of lanterns lit for nobody in particular","a house with a door in the roof","a flock of paper birds migrating north","a standing stone wearing a scarf","a dog on a hill that watched the whole train go by","a lake the exact shape of a hand","a market stall selling single socks","a cloud tethered to a fence post","a ladder leaning on nothing, going up"],Il=["Passed","Saw","Rolled by","Slowed for"],ju=["The Marigold","The Folk","The Line"],Ju={miles:i=>`Travel ${i} miles`,aboard:i=>`Have ${i} ${i===1?"traveller":"travellers"} aboard`,met:i=>`Meet ${i} ${i===1?"stranger":"strangers"} at stations`,unfolds:i=>`Unfold the train ${i} ${i===1?"time":"times"}`,rooms:i=>`Build ${i} rooms`,keepsakes:i=>`See ${i} ${i===1?"traveller":"travellers"} off at their stop`,returns:i=>`Welcome back ${i} ${i===1?"old friend":"old friends"}`,letters:i=>`Receive ${i} ${i===1?"letter":"letters"} from people who have left`,postcards:i=>`Collect ${i} postcards`,tickets:i=>`Cross into ${i} regions`,tales:i=>`Hear ${i} tales from your passengers`,levels:i=>`Furnish rooms to ${i} levels in all`},Xn=[{id:"start",vol:0,scene:"once",title:"Once Upon a Rail",need:{},text:"There was once a small train called the Marigold, and she was far larger inside than out. Nobody remembers who stitched the charm into her seams. Everybody agrees it was done kindly."},{id:"cap",vol:0,scene:"cap",title:"The Conductor's Cap",need:{miles:4},text:"On a hook in the cab hung a cap exactly your size. It smelled of coal smoke and oranges. Nobody had told you whose it was, so you wore it, and the engine seemed to settle, as if relieved."},{id:"track",vol:0,scene:"track",title:"A Little Way Ahead",need:{miles:15},text:"The track was only ever laid a short way ahead of the wheels, and was gone a short way behind. The Marigold had never once been lost. She had also never once looked back."},{id:"guest",vol:0,scene:"guest",title:"The First Guest",need:{aboard:1},text:"The first passenger did not ask where the train was going. They asked whether there was tea. That, the Marigold understood at last, was what she was for."},{id:"room",vol:0,scene:"unfold",title:"More Room",need:{unfolds:2},text:"The charm was never a trick of space. It was a kindness. The train unfolds exactly as far as the people aboard can use, and always a little farther, in case someone else is coming."},{id:"initials",vol:0,scene:"initials",title:"Two Letters",need:{miles:70},text:"Every sleeper on the Line has two letters pressed into its end, always the same size and the same depth: M. L. They are not a maker's mark. They are more like a signature on a letter someone hoped you would answer."},{id:"seat",vol:0,scene:"seat",title:"The Warm Seat",need:{aboard:3},text:"In the cab there is a worn seat that nobody has been brave enough to sit in. Whenever the train is happiest, the seat is warm, as though someone has only just stood up."},{id:"village",vol:0,scene:"village",title:"More Village Than Train",need:{rooms:8},text:"By now the Marigold was less a train than a village that happened to travel. There were chimneys. There was a garden. There was a clock on the wall that told the right time, but only in the evenings."},{id:"keep",vol:1,scene:"keep",title:"What Is Left Behind",need:{keepsakes:1},text:"When someone steps off at their stop, they leave a small thing: a button, a tune, a way of folding napkins. The train keeps every one. She does not call it clutter. She calls it company."},{id:"mail",vol:1,scene:"letters",title:"The Post Car",need:{letters:1},text:'Nobody can say how it reaches the Marigold, since she has no address, but a letter arrived from someone who had stepped off at a station long ago. It began, "Dear conductor, I hope the train is well." It ended, "I am."'},{id:"return",vol:1,scene:"guest",title:"A Familiar Face",need:{returns:1},text:"The platform was crowded, but you knew the one in the middle at once, because they were waving with the whole of their arm. They had changed, a little, the way people do when something has gone well. The Marigold slowed, and did not mind being late."},{id:"log1",vol:0,scene:"cap",title:"The Conductor's Log",need:{jobs:1},text:'In the cab you found a log, and in the log, a first line already written in a hand you almost knew: "Do one small thing well, and the train notices." You did one small thing. The page below it, a little embarrassed, wrote itself.'},{id:"log2",vol:1,scene:"dinner",title:"Small Duties",need:{jobs:8},text:"Pouring tea, carrying the post bag, picking up a dropped glove. None of it is grand. The Marigold has always run on this kind of thing: a great many small kindnesses, done on foot, by someone who stayed."},{id:"log3",vol:2,scene:"seat",title:"What the Cap Remembers",need:{jobs:25},text:'On the twenty-fifth page of the log there is a drawing of the Marigold, and beside it, in the margin: "Thank you for walking her." The cap on the hook is warm. It is, you notice, very slightly too small, as though it has been waiting for someone younger. Or someone who has just begun.'},{id:"dinner",vol:1,scene:"dinner",title:"Stories at Dinner",need:{tales:3},text:"Somewhere between the soup and the second pot of tea, people began to tell the truth. Nobody planned it. The Marigold only dimmed the lamps a little and kept the kettle warm."},{id:"glow",vol:1,scene:"glow",title:"The Well-Loved Rooms",need:{levels:4},text:"A room loved enough begins to glow at the edges. It is not a spell. Rooms simply do this, when enough people have been happy in them, and have said so."},{id:"table",vol:1,scene:"dinner",title:"The Long Table",need:{aboard:6},text:"Six chairs, then eight, then more than the table was long. Nobody ever stood. The Marigold, who has never turned anyone away, rearranged her walls so that no one would have to."},{id:"letters",vol:1,scene:"letters",title:"Letters in the Drawer",need:{postcards:12},text:"In the drawer of the dining car were postcards from places you did not remember visiting. They were all in the same handwriting. It was your own, a little younger, a little braver."},{id:"name",vol:1,scene:"name",title:"A Name, Spoken Once",need:{keepsakes:4},text:"A guest once asked to be called nothing at all, and was. When they left, they said the name aloud, once, to the engine. The Marigold hums it still, very softly, when no one is listening."},{id:"regions",vol:2,scene:"regions",title:"Fens and Hills",need:{tickets:3},text:"The Line was never one place. It was a great many, stitched edge to edge like a quilt, and each had its own weather and its own way of saying hello. The Marigold learned them the way you learn the moods of a friend."},{id:"ghost",vol:2,scene:"ghost",title:"The Other Train",need:{miles:160},text:"At dusk, a train very like yours passed going the other way. The carriages were dark. Every window held a face, and every face looked at you as if it knew you were coming, and was glad."},{id:"ladder",vol:2,scene:"ladder",title:"A Ladder to Nowhere",need:{miles:260},text:"Some things on the Line are simply there: a ladder leaning on nothing, a house with a door in the roof, a cloud tied to a fence. They are not mysteries. They are happier unexplained."},{id:"gate",vol:2,scene:"gate",title:"The Gates",need:{tickets:6},text:"At the edge of every country there is a gate, and every gate has a sign that says Now Entering. In all her years the Marigold had never once been turned back. She had begun to suspect that the gates were put up for her."},{id:"ends",vol:2,scene:"road",title:"Where It Ends",need:{miles:500},text:"Everyone asks where the Line ends. The ones who ask longest stop asking, and start to wonder instead where it begins, and who was standing at the very first sleeper with a hammer and a great deal of hope."},{id:"ml",vol:2,scene:"initials",title:"M. L. B.",need:{miles:1e3},text:'On one sleeper, just one, there are three letters instead of two: M. L. B. Beneath it, a note, in your handwriting: "Welcome back. You laid this one yourself."'},{id:"last",vol:2,scene:"last",title:"There Is No Last Page",need:{miles:1600,tickets:10},text:"There is no last page. There is only the next one, still blank, and a pencil left on the windowsill for you. The Marigold waits at the platform with her engine humming. She is in no hurry. She has never been in a hurry."}],Pl=["where the light came in sideways","where the kettle was always just about to boil","where the road forgot to turn","where the hills leaned in to listen","where something was quietly growing","where the birds were all facing the same way","where the fog made everything polite","where the stationmaster waved with his whole arm"],Ll=["Tap <b>Stoke</b> in time with the needle to build steam. The Line speeds up when she is hot.","A stop is coming. Passengers will bring their own gifts and their own stories.","Open <b>Inside</b>. The train is bigger in there than it looks. Build rooms by dragging on the floor.","Passengers walk your layout. The closer their favorite rooms, the happier they are, and the more Charm they bring."],Dl={warm:{label:"Offer tea and a seat",sub:"A cup, a warm corner"},curious:{label:"Ask where they are headed, and why",sub:"Listen properly"},space:{label:"Show them somewhere quiet",sub:"No questions yet"}},Ku={warm:["{name} keeps glancing toward the kettle on your cab stove.","{name} is holding a coat that is clearly a size too thin for the weather."],curious:["{name} is reading every sign on the platform, twice.","{name} has asked the stationmaster three questions before the train finished stopping."],space:["{name} stands a little apart from the crowd, as if listening to something far off.","{name} holds the strap of a bag very tightly, and says very little."]},Qu={delighted:{warm:'{name} laughs, and the tension goes out of their shoulders. "Tea. Of course. How did you know?"',curious:'{name} brightens like a lamp. "No one ever asks why. Sit, and I will tell you all of it."',space:'{name} lets out a breath they seem to have held since the last station. "Yes. That is exactly what I needed."'},warm:{warm:'{name} accepts the cup with both hands. "That is kind. Thank you."',curious:'{name} considers it. "Somewhere ahead. For reasons. But thank you for asking."',space:'{name} nods slowly. "A quiet corner would be welcome."'},polite:{warm:'{name} takes the tea, and sets it down very politely. "Thank you. Perhaps later."',curious:'{name} gives a small, careful smile. "It is a long story. Perhaps after supper."',space:'{name} glances around the corridor. "Lovely. Although, I think I would like company, actually."'}},So={delighted:"You read them well.",warm:"A kind start.",polite:"A gentle start.",quick:"A quick welcome."},Ul={garden:'{name} presses a seed into your palm. "Plant it where it is least expected."',library:'{name} slides a bookmark between two pages of the Journal. "For when you lose your place."',workshop:'{name} taps the boiler gauge twice, fondly. "She will be fine. She was always going to be fine."',observatory:'{name} points at the ceiling, which is somehow also the sky. "That one. Look for it tonight."',bath:'{name} leaves a small, warm towel on the rail. "In case anyone is cold. Someone always is."',music:'{name} hums three notes at the door, and the engine hums the fourth. "There. Now it is finished."',aquarium:'{name} taps the tank glass once, gently. "Look after one another."',chat:'{name} shakes your hand a moment longer than people usually do. "Good company is rarer than it looks."'},Nl={garden:["Dear conductor, I planted the first seed by the {place} gate. Something is already coming up. It looks like hope, which is what I hoped it would look like.","Dear conductor, the orchard at {place} is in leaf. A child asked me what the tallest tree was called. I said it had not decided."],library:["Dear conductor, I found a small library at {place}, and told them what I know about putting books in order. They put the books in a circle. It works better.","Dear conductor, I have been reading the same chapter aloud to the {place} ferrymen. They do not agree on the ending. I am delighted."],workshop:["Dear conductor, I mended the clock at {place} station. It chimed for the first time in thirty years. Nobody knew what time it was, but everyone was glad.","Dear conductor, there is a hinge at {place} that squeaks in tune. I left it alone."],observatory:["Dear conductor, from {place} the sky looks very much like the one from your windows. I take that to mean we are all under the same one.","Dear conductor, I found a very small star at {place} that I think is shy. I have not told anyone."],bath:["Dear conductor, there is a hot spring at {place}. I have asked it to be patient and it has agreed to stay warm until you come.","Dear conductor, I opened a bathhouse at {place}. The first customer stayed three days and has written a poem."],music:["Dear conductor, I sang in the square at {place}. A dog joined in. It was the best duet of my career.","Dear conductor, the station at {place} has an echo that answers a half-beat late. I am teaching it a song."],aquarium:["Dear conductor, I dropped a line in the lake at {place}. Nothing bit. I count it a very good morning.","Dear conductor, the pond at {place} has a fish that waves. Gerald would have approved."],chat:["Dear conductor, I told the whole of {place} about the Marigold. Half of them did not believe me. The other half are waiting at the platform.","Dear conductor, I have found a bench at {place} that seats exactly the number of people I wanted to talk to. It is a good bench."]},Mr={garden:"Their orchard has come into bloom, and they have brought a cutting for the garden room.",library:"They have started a small lending library, and they are back with the first overdue book.",workshop:"They are back with a new wrench, and a plan for a better hinge on the aisle door.",observatory:"They found the star they were looking for. It was a lot smaller than expected, and exactly right.",bath:"Their bathhouse is full every night now. They are back for a week of doing nothing at all.",music:"They have finished the song. They are back to sing it t
