<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120c22">
<title>The Marigold Line</title>
<style>
:root {
  --bg: #120c22; --glass: rgba(26, 18, 42, .8); --glass2: rgba(40, 28, 62, .92); --line: rgba(255, 214, 160, .16);
  --fg: #f8eedd; --muted: #bcaccb; --gold: #f2b134; --gold-ink: #2c1a04; --teal: #6fe0d0; --rose: #ff8aa6; --bad: #ff7a7a; --good: #7dffb0;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --ui: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 500 15px/1.4 var(--ui); overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.float { position: absolute; transform: translate(-50%, -50%); font-weight: 700; color: #ffe2a8; text-shadow: 0 1px 6px rgba(0,0,0,.85); animation: rise 1.4s ease-out forwards; white-space: nowrap; font-variant-numeric: tabular-nums; }
.float.perfect { color: #9dffc4; font-size: 18px; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -220%); } }
.rname { position: absolute; transform: translate(-50%, -50%); font: 700 10.5px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: rgba(255,240,220,.85); text-shadow: 0 1px 4px #000; white-space: nowrap; }
.bubble { position: absolute; transform: translate(-50%, -100%); background: var(--glass2); border: 1px solid var(--line); padding: 5px 10px; border-radius: 12px; font-size: 12.5px; max-width: 190px; text-align: center; backdrop-filter: blur(6px); }
.bubble b { color: var(--gold); margin-right: 4px; }

#hud { position: fixed; left: calc(var(--sal) + 10px); right: calc(var(--sar) + 10px); top: calc(var(--sat) + 10px); display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
.pill { pointer-events: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 7px 12px; backdrop-filter: blur(10px); display: grid; gap: 1px; min-width: 0; }
.pill .row { display: flex; align-items: center; gap: 7px; }
.pill b { font: 700 19px/1 var(--display); font-variant-numeric: tabular-nums; }
.pill small { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.charm { background: radial-gradient(circle at 35% 30%, #fff, #ffd36a 55%, #e0902a); box-shadow: 0 0 10px #ffd36a; border-radius: 3px; transform: rotate(45deg); }
.dot.mile { background: #6fe0d0; box-shadow: 0 0 8px #6fe0d0; }
#milePill { margin-left: auto; text-align: right; }
#milePill .row { justify-content: flex-end; }
#milePill b { font-size: 16px; }
#menuBtn { pointer-events: auto; width: 40px; height: 40px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); font-size: 18px; flex: none; }

#hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 172px); max-width: min(520px, calc(100vw - 28px)); background: var(--glass2); border: 1px solid var(--gold); padding: 9px 16px; border-radius: 16px; text-align: center; font-size: 14px; backdrop-filter: blur(10px); pointer-events: none; }
#fork { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--sat) + 76px); width: min(520px, calc(100vw - 20px)); display: grid; gap: 6px; text-align: center; }
#fork .cap { font: 700 11px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); text-shadow: 0 1px 4px #000; }
#fork .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fk { background: var(--glass2); border: 1.5px solid var(--line); border-radius: 16px; padding: 9px 10px; display: grid; gap: 2px; backdrop-filter: blur(10px); }
.fk b { font: 700 15px var(--display); } .fk small { color: var(--muted); font-size: 11.5px; }
.fk[aria-pressed="true"] { border-color: var(--good); background: rgba(40, 80, 60, .85); }
#platform { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--sat) + 76px); background: var(--gold); color: var(--gold-ink); padding: 9px 16px; border-radius: 99px; font-weight: 700; box-shadow: 0 0 22px rgba(242, 177, 52, .6); animation: pulse 1.6s ease-in-out infinite; max-width: calc(100vw - 20px); }
@keyframes pulse { 50% { box-shadow: 0 0 34px rgba(242, 177, 52, .95); } }

#stoke { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 78px); display: grid; gap: 6px; justify-items: center; width: min(300px, calc(100vw - 24px)); }
#stokeBtn { width: 100%; height: 58px; border-radius: 20px; background: var(--glass2); border: 1.5px solid var(--gold); position: relative; overflow: hidden; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
#stokeBtn .zone { position: absolute; top: 0; bottom: 0; left: 38%; width: 24%; background: rgba(125, 255, 176, .28); border-left: 2px solid rgba(125,255,176,.7); border-right: 2px solid rgba(125,255,176,.7); }
#stokeBtn .needle { position: absolute; top: 0; bottom: 0; width: 5px; background: #fff; box-shadow: 0 0 12px #fff; border-radius: 3px; left: 0; }
#stokeBtn span { position: relative; text-shadow: 0 1px 4px #000; }
#steam { width: 100%; height: 6px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; }
#steam i { display: block; height: 100%; background: linear-gradient(90deg, #6fe0d0, #f2b134, #ff7a5a); width: 20%; }
#steamTxt { font-size: 11px; color: var(--muted); text-shadow: 0 1px 3px #000; }

#inbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 78px); display: flex; gap: 8px; }
.tool { background: var(--glass2); border: 1.5px solid var(--line); border-radius: 18px; padding: 11px 18px; font-weight: 700; backdrop-filter: blur(10px); }
.tool.primary { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.tool[aria-pressed="true"] { border-color: var(--good); }

#dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 10px); display: flex; gap: 4px; background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 5px; backdrop-filter: blur(12px); max-width: calc(100vw - 16px); }
#dock button { min-width: 64px; height: 52px; padding: 0 10px; border-radius: 17px; font-weight: 700; font-size: 13.5px; display: grid; gap: 1px; place-items: center; align-content: center; color: var(--muted); position: relative; }
#dock button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#dock button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
.badge { position: absolute; top: 5px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 8px var(--rose); }

#sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 76px); width: min(520px, calc(100vw - 16px)); background: var(--glass2); border: 1px solid var(--line); border-radius: 22px; padding: 14px; backdrop-filter: blur(14px); display: grid; gap: 10px; max-height: 56vh; overflow: auto; touch-action: pan-y; }
#sheet h3 { margin: 0; font: 700 17px/1.2 var(--display); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
#sheet h3 small { font: 500 12px var(--ui); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.act { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 15px; padding: 10px; text-align: left; display: grid; gap: 3px; min-height: 60px; align-content: start; }
.act:hover { border-color: var(--gold); }
.act b { font-size: 14px; }
.act .cost { font-size: 12px; color: var(--gold); font-variant-numeric: tabular-nums; }
.act .cost.no { color: var(--bad); }
.act small { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.act.primary { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.act.primary small, .act.primary .cost { color: var(--gold-ink); opacity: .85; }
.act[disabled] { opacity: .45; cursor: default; }
.act.locked { opacity: .5; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--gold); color: var(--gold-ink); border-radius: 99px; padding: 9px 18px; font-weight: 700; }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--fg); border: 1px solid var(--line); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }

#modal { position: fixed; inset: 0; background: rgba(8, 4, 16, .66); display: grid; place-items: center; padding: calc(var(--sat) + 14px) 14px calc(var(--sab) + 14px); backdrop-filter: blur(4px); z-index: 30; touch-action: pan-y; }
.card { width: min(580px, 100%); max-height: 100%; overflow: auto; background: linear-gradient(180deg, #2c2046, #1b1329); border: 1px solid var(--line); border-radius: 26px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.card h2 { margin: 0; font: 700 26px/1.1 var(--display); text-wrap: balance; }
.card h2 em { font-style: normal; color: var(--gold); }
.card p { margin: 0; color: #eadff0; line-height: 1.5; }
.card .eyebrow { font: 700 11px var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.quote { font-family: var(--display); font-style: italic; font-size: 17px; line-height: 1.5; color: #fff1d8; border-left: 3px solid var(--gold); padding-left: 14px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; } .stats div { display: grid; }
.stats b { font: 700 26px/1.1 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; } .stats small { color: var(--muted); }
.tales { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.tales li { background: rgba(255,255,255,.05); border-radius: 14px; padding: 10px 12px; font-size: 14px; line-height: 1.45; }
.tales li.locked { color: var(--muted); font-style: italic; }
.card-pc { background: #f4e8cc; color: #3a2a1a; border-radius: 6px; padding: 10px 12px; font-family: var(--display); font-size: 14px; line-height: 1.4; box-shadow: 0 2px 0 #c9b88c; }
.card-pc small { display: block; color: #8a7a5a; font: 600 10.5px var(--ui); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.pcs { display: grid; gap: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: rgba(242, 177, 52, .16); border: 1px solid rgba(242,177,52,.4); color: #ffe2a8; border-radius: 99px; padding: 3px 10px; font-size: 12px; }
.bar { height: 7px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--rose), var(--gold)); }
.list { display: grid; gap: 8px; }
.item { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 6px; text-align: left; }
.item b { font: 700 16px var(--display); } .item small { color: var(--muted); }
input[type=text] { font: inherit; background: rgba(255,255,255,.08); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; width: 100%; user-select: text; -webkit-user-select: text; }
#toast { position: fixed; left: 50%; top: calc(var(--sat) + 68px); transform: translateX(-50%); display: grid; gap: 6px; pointer-events: none; width: min(440px, calc(100vw - 24px)); z-index: 20; }
.toast { background: var(--glass2); border: 1px solid var(--line); border-radius: 14px; padding: 9px 14px; text-align: center; font-size: 13.5px; animation: toast 4.4s ease-out forwards; backdrop-filter: blur(10px); }
.toast b { color: var(--gold); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8% { opacity: 1; transform: none; } 88% { opacity: 1; } 100% { opacity: 0; } }
#fade { position: fixed; inset: 0; background: #120c22; pointer-events: none; opacity: 0; transition: opacity .22s; z-index: 15; }
#drawcost { position: fixed; transform: translate(-50%, -140%); background: var(--glass2); border: 1px solid var(--line); border-radius: 12px; padding: 5px 10px; font-size: 12.5px; pointer-events: none; z-index: 12; white-space: nowrap; }
#drawcost.bad { border-color: var(--bad); color: #ffc8c8; }
@media (prefers-reduced-motion: reduce) { .float, .toast, #platform { animation-duration: .01s; animation-iteration-count: 1; } }
@media (max-height: 560px) { #sheet { max-height: 46vh; } #hint { display: none; } }
</style>
</head>
<body>
<canvas id="gl" aria-label="The Marigold Line, a small steam train that is larger on the inside"></canvas>
<div id="labels"></div>

<div id="hud">
  <div class="pill" id="charmPill"><div class="row"><i class="dot charm"></i><b id="charm">0</b></div><small id="rate">&nbsp;</small></div>
  <div class="pill" id="milePill"><div class="row"><b id="miles">0</b><i class="dot mile"></i></div><small id="region">&nbsp;</small></div>
  <button id="menuBtn" aria-label="Menu">&#9776;</button>
</div>

<div id="fork" hidden></div>
<button id="platform" hidden></button>
<div id="hint" hidden></div>

<div id="stoke">
  <button id="stokeBtn" aria-label="Stoke the boiler"><i class="zone"></i><i class="needle" id="needle"></i><span>Stoke</span></button>
  <div id="steam"><i id="steamBar"></i></div>
  <div id="steamTxt">Steam</div>
</div>

<div id="inbar" hidden>
  <button class="tool primary" id="bBuild">Build a room</button>
  <button class="tool" id="bUnfold">Unfold space</button>
</div>

<div id="sheet" hidden></div>
<div id="drawcost" hidden></div>

<nav id="dock" aria-label="Main">
  <button id="bLine" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 17h18M6 17V9h8l3 3v5M9 9V6h3v3"/><circle cx="8" cy="19" r="1.4"/><circle cx="16" cy="19" r="1.4"/></svg>Line</button>
  <button id="bInside" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 12h17M12 5v14"/></svg>Inside</button>
  <button id="bPeople"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg>People</button>
  <button id="bBook"><svg viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M8 20a3 3 0 0 1-3-3"/></svg>Journal<i class="badge" id="bookBadge" hidden></i></button>
</nav>

<div id="toast" aria-live="polite"></div>
<div id="modal" hidden></div>
<div id="fade"></div>

<script>(()=>{var Be={sleeper:{name:"Sleeper",base:!0,cost:5,min:2,max:6,floor:8018570,floor2:7229310,blurb:"Berths for sleepers. Every three tiles holds one passenger."},dining:{name:"Dining Car",base:!0,cost:6,min:2,max:6,floor:12089674,floor2:11103040,blurb:"Long tables, warm lamps and something always on the stove."},parlor:{name:"Parlor",base:!0,cost:6,min:2,max:6,floor:10111578,floor2:9192015,blurb:"Armchairs and a rug. The best place for nothing in particular."},corridor:{name:"Corridor",base:!0,cost:2,min:2,max:14,line:!0,floor:13218954,floor2:12297852,blurb:"A one-tile passage. It links rooms and shortens the walk to dinner."},garden:{name:"Garden Room",base:!1,cost:8,min:2,max:6,floor:5212746,floor2:4685635,blurb:"Soil, light and things growing where they should not fit."},library:{name:"Library",base:!1,cost:8,min:2,max:6,floor:6965812,floor2:6242349,blurb:"Shelves to the ceiling, which here is a matter of opinion."},workshop:{name:"Workshop",base:!1,cost:8,min:2,max:6,floor:8026752,floor2:7237236,blurb:"A bench, a vice and a great many small drawers."},observatory:{name:"Observatory",base:!1,cost:9,min:3,max:6,floor:3293294,floor2:2766690,blurb:"A brass dome and a telescope pointed at whatever is out there."},bath:{name:"Bathhouse",base:!1,cost:8,min:2,max:6,floor:4889256,floor2:4361627,blurb:"A deep warm pool. Steam, and not much conversation."},music:{name:"Music Room",base:!1,cost:8,min:3,max:6,floor:12097098,floor2:11242050,blurb:"A piano that is slightly bigger on the inside, like everything else."},aquarium:{name:"Aquarium",base:!1,cost:9,min:3,max:6,floor:3041930,floor2:2580608,blurb:"Glass tanks, slow fish, and a very calm hum."}},$n={garden:"garden",library:"library",workshop:"workshop",observatory:"observatory",bath:"bath",music:"music",aquarium:"aquarium",chat:"parlor"},$r=[{name:"Rosalind Thorne",trait:"Seedswoman with a coat full of pockets",hobby:"garden",gift:"garden",line:'A woman in a coat with far too many pockets waves a watering can. "I am bound for the Salt Orchards. I have never been invited to dinner by a train."',keep:{name:"A pocketful of seeds",line:"Everywhere on the train, something small is quietly growing."},tales:["Rosalind keeps seeds from every place she has left. She says a pocket is a very small country.",'Rosalind plants one seed at every stop and never returns. "Someone will. That is the point."',"Rosalind admits the seeds are not for growing. They are for leaving things behind that look like hope."]},{name:"Ambrose Quill",trait:"Retired postmaster who still sorts the mail",hobby:"library",gift:"library",line:'A thin man with a ledger under his arm tips his hat. "Postmaster, retired. Bound for Lantern Wick, where my last letter has been waiting forty years."',keep:{name:"A last letter, finally delivered",line:"The train feels a little more like it is going somewhere."},tales:["Ambrose sorts the dining car's napkins by destination. They do not know where they are going. He does.","Ambrose says every letter is a small door someone left open on purpose.","The forty-year-old letter is addressed to him. He has not opened it. He says that is what makes it perfect."]},{name:"Tamsin Brass",trait:"Clockmender who talks to broken things",hobby:"workshop",gift:"workshop",line:'Someone is sitting on a trunk, fixing a pocket watch with their teeth and a hairpin. "Tamsin. Clocks. Is your engine whistling? That is a cry for help."',keep:{name:"A tuned boiler gauge",line:"The engine hums a little steadier, and a little more fondly."},tales:["Tamsin says nothing is truly broken. It is only waiting for someone to ask what is wrong.","Tamsin found a clock in the Lost & Found that runs backward. She has decided it is correct.",`Tamsin opened the engine's oldest clock and found a note: "Do not hurry her. She is carrying more than you can see."`]},{name:"Old Eben",trait:"Stargazer who lost his telescope in a lake",hobby:"observatory",gift:"observatory",line:'An old man in a long scarf stares up at the dusk. "I have misplaced a telescope and a great deal of sky. Are you going anywhere with a view?"',keep:{name:"A map of the night sky",line:"The windows show more stars after dark."},tales:["Eben says the stars are not far away, only patient.","Eben has named the star he can see from every region. He never says the names aloud, only points.","Eben notes that the stars look the same from the Marigold as they did from home, and says that is how he knows the train is real."]},{name:"Cressida Vale",trait:"Opera singer on an unplanned holiday",hobby:"music",gift:"music",line:'A woman in a green velvet coat balances three hatboxes on one finger. "I have stopped singing for a season. Do you have a piano? I will not touch it."',keep:{name:"A tune left in the rafters",line:"Sometimes, very faintly, the carriages hum in harmony."},tales:["Cressida touches the piano on the third day, mostly by accident.","Cressida sings to the engine at night. It is, she says, an excellent audience, and never asks for an encore.","Cressida finishes the song she never could. Nobody applauds. Everybody understands."]},{name:"Madame Oussou",trait:"Keeper of a bathhouse that does not exist anymore",hobby:"bath",gift:"bath",line:'A small, imposing woman in a robe the color of a sunset hands you a towel. "I keep a bathhouse. Kept. Have you got a room that is warm and slightly rude to rushing?"',keep:{name:"A tin of bath salts",line:"Everyone on the train smells faintly of lavender and has stopped arguing."},tales:["Madame Oussou says a good soak solves three things and ruins one. Nobody knows what the one is.",'Madame Oussou reveals the old bathhouse was under a lake. "Hot water will find a way. It always does."',"Madame Oussou admits she is not going anywhere. She is looking for a place that deserves her."]},{name:"Fenwick Moss",trait:"Fisherman who has never caught anything on purpose",hobby:"aquarium",gift:"aquarium",line:'A man in waders carries a bucket with a very calm fish. "This is Gerald. He is not for sale, but he does love a long train ride."',keep:{name:"Gerald's tank, left behind",line:"A small, steady gurgling comes from somewhere in the walls."},tales:["Fenwick says fish do not mind water. They mind the quiet.","Fenwick has been to the bottom of most of the lakes on the Line. He says they are all the same lake.","Fenwick lets Gerald out of the bucket. Gerald swims in a tight, happy circle and does not leave."]},{name:"Juniper Oakes",trait:"A child traveling with a very serious goose",hobby:"chat",gift:"parlor",line:'A child in oversized boots stands next to a goose. "This is Admiral. She is in charge. We are going to see the sea. Do you have a sea?"',keep:{name:"Admiral's feather",line:"There is a very small flag on the roof. It was not there before."},tales:["Juniper says Admiral does not approve of the dining car. She approves of the aisle, loudly.","Juniper draws a map of the train. It has far more rooms than the real one, and she insists they are all there.","Juniper sees the sea. Admiral is unimpressed. Juniper is not."]},{name:"Hob Marlowe",trait:"A lamplighter who has run out of lamps",hobby:"workshop",gift:"workshop",line:'A man with a pole and nothing to light leans against the station wall. "Lamplighter. All my lamps got tired. Is there anywhere that needs a little more light?"',keep:{name:"A very patient lamp",line:"Somewhere on the train, a lamp lights itself when someone is sad."},tales:["Hob says a lamp does not push the dark away. It just keeps it company.","Hob lights each room before the passengers wake. He has not told anyone, and everyone knows.","Hob has run out of lamps and has begun lighting them with other people's kind words."]},{name:"Delphine Aubrey",trait:"Cartographer of places that keep moving",hobby:"library",gift:"library",line:'A woman unrolls a map that is clearly wriggling. "Cartographer. I draw places that will not hold still. May I ride along until this one stops?"',keep:{name:"A map that mostly behaves",lin
